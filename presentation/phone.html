<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/icon.jpg" type="image/x-icon">
    <title>The New Gym</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/second.css">
    <link rel="stylesheet" href="../assets/css/phone.css">
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <div class="containerNav">
        <div class="containerNav-banner">
            <ul class="containerNav-banner__list">
                <li class="containerNav-banner__list-item">GYM CHO MỌI NGƯỜI</li>
            </ul>
        </div>

        <div class="containerNav__navbar">
            <div class="containerNav__navbar-logo">
                <a href="../index.html">
                    <img src="../assets/images/logo.jpg" alt="Logo" class="containerNav__navbar-logo-img">
                </a>
            </div>

            <span class="containerNav__navbar-menu-list-item">
                <div class="steps-container">
                    <div class="step pass">1</div>
                    <div class="line active"></div>
                    <div class="step active">2</div>
                    <div class="line active"></div>
                    <div class="step">3</div>
                    <div class="line"></div>
                    <div class="step">4</div>
                </div>
            </span>
        </div>
    </div>

    <!-- Main -->
    <div class="containerNewGym">
        <h2>Số điện thoại của bạn?</h2>
        <form id="phoneForm">
            <div class="phone-input">
            <img src="https://flagcdn.com/w40/vn.png" alt="VN Flag">
            <input type="text" id="phone" placeholder="Nhập số điện thoại" />
            </div>
            <div id="errorMsg" class="error">Số điện thoại không hợp lệ. Vui lòng nhập đúng 10 chữ số.</div>
            <button class="phoneNext" type="submit">Tiếp tục</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('phoneForm');
        const phoneInput = document.getElementById('phone');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', function(e) {
        e.preventDefault();
        const phone = phoneInput.value.trim();

        const isValid = /^[0-9]{10}$/.test(phone);
            if (!isValid) {
                errorMsg.style.display = 'block';
            } else {
                errorMsg.style.display = 'none';
                window.location = "./confirm.html";
            }
        });
    </script>
</body>
</html>
